<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>OBD2 Test - ProPart</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Segoe UI',Roboto,sans-serif}
        body{background:#0A1428;color:#D0E4F5;min-height:100vh;padding:16px}
        .container{max-width:600px;margin:0 auto}
        h1{font-size:22px;color:#F5A623;margin-bottom:6px;text-align:center}
        .sub{font-size:11px;color:#6880A0;text-align:center;margin-bottom:18px}
        .card{background:#0F1A30;border:1px solid #1E2D4A;border-radius:12px;padding:14px;margin-bottom:12px}
        .card-title{font-size:12px;color:#F5A623;font-weight:700;letter-spacing:1px;margin-bottom:10px;text-transform:uppercase}
        .btn{background:linear-gradient(135deg,#F5A623,#C47008);border:none;color:#000;padding:14px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-bottom:8px;letter-spacing:.5px}
        .btn:active{transform:scale(.98)}
        .btn.gray{background:#1E2D4A;color:#D0E4F5}
        .btn.green{background:linear-gradient(135deg,#3FB950,#1A7A2E);color:#fff}
        .btn.red{background:linear-gradient(135deg,#F23E3E,#A02020);color:#fff}
        .btn:disabled{opacity:.4;cursor:not-allowed}
        .status{padding:10px;border-radius:8px;margin-bottom:10px;text-align:center;font-size:12px;font-weight:600}
        .status.off{background:#3A1F1F;color:#F23E3E;border:1px solid #F23E3E}
        .status.on{background:#1F3A24;color:#3FB950;border:1px solid #3FB950}
        .status.wait{background:#3A2E1F;color:#F5A623;border:1px solid #F5A623}
        .dev-list{max-height:250px;overflow-y:auto;margin-bottom:10px}
        .dev-item{background:#1E2D4A;border:1px solid #2A3F5F;padding:10px 12px;border-radius:8px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
        .dev-item:active{background:#2A3F5F}
        .dev-name{font-size:13px;font-weight:600;color:#D0E4F5}
        .dev-mac{font-size:10px;color:#6880A0;font-family:monospace}
        .live-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .live-box{background:#1E2D4A;padding:10px;border-radius:8px;text-align:center}
        .live-lbl{font-size:9px;color:#6880A0;letter-spacing:1px;font-weight:700}
        .live-val{font-size:24px;color:#F5A623;font-weight:700;margin:4px 0}
        .live-unit{font-size:10px;color:#6880A0}
        .console{background:#000;color:#3FB950;font-family:monospace;font-size:10px;padding:10px;border-radius:6px;height:200px;overflow-y:auto;border:1px solid #1A1A1A}
        .console-line{margin-bottom:2px;line-height:1.3}
        .console-line.tx{color:#F5A623}
        .console-line.rx{color:#3FB950}
        .console-line.err{color:#F23E3E}
        .console-line.info{color:#6880A0}
        .dtc-list{max-height:200px;overflow-y:auto}
        .dtc-item{background:#3A1F1F;border-left:3px solid #F23E3E;padding:8px 10px;margin-bottom:4px;border-radius:4px}
        .dtc-code{font-weight:700;color:#F23E3E;font-size:13px}
        .dtc-desc{font-size:10px;color:#D0E4F5;margin-top:2px}
        .empty{text-align:center;color:#6880A0;padding:20px;font-size:11px}
    </style>
</head>
<body>
<div class="container">

    <h1>🚗 OBD2 TEST</h1>
    <div class="sub">Test mínimo - Vgate iCar Pro BLE 4.0</div>

    <!-- Status -->
    <div class="card">
        <div id="status" class="status off">⚪ DESCONECTADO</div>
        <button class="btn" id="btnScan" onclick="doScan()">🔍 ESCANEAR DISPOSITIVOS</button>
        <button class="btn red" id="btnDisconnect" onclick="doDisconnect()" disabled>❌ DESCONECTAR</button>
    </div>

    <!-- Lista de dispositivos -->
    <div class="card" id="cardDevices" style="display:none">
        <div class="card-title">📡 Dispositivos encontrados</div>
        <div class="dev-list" id="devList"></div>
    </div>

    <!-- Datos en vivo -->
    <div class="card" id="cardLive" style="display:none">
        <div class="card-title">📊 Datos en vivo (Tsuru / Aveo)</div>
        <div class="live-grid">
            <div class="live-box">
                <div class="live-lbl">RPM</div>
                <div class="live-val" id="vRPM">---</div>
                <div class="live-unit">rpm</div>
            </div>
            <div class="live-box">
                <div class="live-lbl">VELOCIDAD</div>
                <div class="live-val" id="vSpeed">---</div>
                <div class="live-unit">km/h</div>
            </div>
            <div class="live-box">
                <div class="live-lbl">TEMP MOTOR</div>
                <div class="live-val" id="vECT">---</div>
                <div class="live-unit">°C</div>
            </div>
            <div class="live-box">
                <div class="live-lbl">TPS</div>
                <div class="live-val" id="vTPS">---</div>
                <div class="live-unit">%</div>
            </div>
            <div class="live-box">
                <div class="live-lbl">VOLTAJE</div>
                <div class="live-val" id="vVolt">---</div>
                <div class="live-unit">V</div>
            </div>
            <div class="live-box">
                <div class="live-lbl">CARGA</div>
                <div class="live-val" id="vLoad">---</div>
                <div class="live-unit">%</div>
            </div>
        </div>
        <button class="btn green" onclick="startLive()" style="margin-top:10px">▶️ INICIAR LECTURA EN VIVO</button>
        <button class="btn gray" onclick="stopLive()">⏸️ PAUSAR</button>
    </div>

    <!-- DTCs -->
    <div class="card" id="cardDTC" style="display:none">
        <div class="card-title">⚠️ Códigos de falla (DTCs)</div>
        <button class="btn" onclick="readDTCs()">📥 LEER DTCs</button>
        <button class="btn red" onclick="clearDTCs()">🗑️ BORRAR DTCs</button>
        <div class="dtc-list" id="dtcList"></div>
    </div>

    <!-- Comandos manuales -->
    <div class="card" id="cardManual" style="display:none">
        <div class="card-title">⌨️ Comandos manuales</div>
        <button class="btn gray" onclick="sendCmd('ATZ')">ATZ (Reset)</button>
        <button class="btn gray" onclick="sendCmd('ATI')">ATI (Versión)</button>
        <button class="btn gray" onclick="sendCmd('ATDP')">ATDP (Protocolo)</button>
        <button class="btn gray" onclick="sendCmd('ATRV')">ATRV (Voltaje batería)</button>
        <button class="btn gray" onclick="sendCmd('0902')">0902 (VIN)</button>
    </div>

    <!-- Consola -->
    <div class="card">
        <div class="card-title">💻 Consola</div>
        <div class="console" id="console">
            <div class="console-line info">[INFO] Lista para escanear...</div>
        </div>
        <button class="btn gray" onclick="clearConsole()" style="margin-top:8px">🧹 Limpiar consola</button>
    </div>

</div>

<script>
    // ========================================
    // VARIABLES GLOBALES
    // ========================================
    let connected = false;
    let liveInterval = null;
    let lastResponse = '';
    let pendingCmd = null;
    let pendingResolver = null;

    // ========================================
    // LOGGING
    // ========================================
    function log(msg, type='info'){
      const c = document.getElementById('console');
      const line = document.createElement('div');
      line.className = 'console-line ' + type;
      const ts = new Date().toLocaleTimeString('es-MX');
      line.textContent = '['+ts+'] ' + msg;
      c.appendChild(line);
      c.scrollTop = c.scrollHeight;
      // Limitar líneas
      while(c.children.length > 100) c.removeChild(c.firstChild);
    }

    function clearConsole(){
      document.getElementById('console').innerHTML = '<div class="console-line info">[INFO] Consola limpiada</div>';
    }

    function setStatus(text, type){
      const s = document.getElementById('status');
      s.textContent = text;
      s.className = 'status ' + type;
    }

    // ========================================
    // CALLBACKS DESDE JAVA (BluetoothService)
    // ========================================
    window.onBleStatus = function(status){
      log('STATUS: '+status, 'info');
      if(status === 'SCANNING'){
        setStatus('🔵 ESCANEANDO...', 'wait');
        document.getElementById('cardDevices').style.display = 'block';
      } else if(status === 'SCAN_COMPLETE'){
        log('Escaneo completo', 'info');
      } else if(status.startsWith('CONNECTING')){
        setStatus('🟡 CONECTANDO...', 'wait');
      } else if(status === 'DISCOVERING'){
        setStatus('🟡 DESCUBRIENDO SERVICIOS...', 'wait');
      } else if(status === 'CONNECTED'){
        setStatus('🟢 CONECTADO', 'on');
        connected = true;
        document.getElementById('btnScan').disabled = true;
        document.getElementById('btnDisconnect').disabled = false;
        document.getElementById('cardDevices').style.display = 'none';
        document.getElementById('cardLive').style.display = 'block';
        document.getElementById('cardDTC').style.display = 'block';
        document.getElementById('cardManual').style.display = 'block';
        log('¡VGATE CONECTADO! 🎉', 'rx');
      } else if(status === 'DISCONNECTED'){
        setStatus('⚪ DESCONECTADO', 'off');
        connected = false;
        document.getElementById('btnScan').disabled = false;
        document.getElementById('btnDisconnect').disabled = true;
        document.getElementById('cardLive').style.display = 'none';
        document.getElementById('cardDTC').style.display = 'none';
        document.getElementById('cardManual').style.display = 'none';
        if(liveInterval){clearInterval(liveInterval);liveInterval=null;}
      }
    };

    window.onUSBStatus = window.onBleStatus; // Compatibilidad

    window.onBleDevice = function(data){
      // data viene como "nombre|address"
      const parts = data.split('|');
      const name = parts[0] || 'Desconocido';
      const address = parts[1] || '';
      log('Encontrado: '+name+' ['+address+']', 'rx');

      const list = document.getElementById('devList');
      // Evitar duplicados
      if(document.querySelector('[data-mac="'+address+'"]')) return;

      const item = document.createElement('div');
      item.className = 'dev-item';
      item.dataset.mac = address;
      item.innerHTML = '<div><div class="dev-name">'+name+'</div><div class="dev-mac">'+address+'</div></div><div style="color:#3FB950">CONECTAR ▶</div>';
      item.onclick = function(){ doConnect(address); };
      list.appendChild(item);
    };

    window.onBleData = function(data){
      log('RX: '+data, 'rx');
      lastResponse = data;

      // Si hay un comando esperando respuesta
      if(pendingResolver){
        const resolver = pendingResolver;
        pendingResolver = null;
        resolver(data);
      }

      // Auto-parseo si hay lectura en vivo
      if(liveInterval && pendingCmd){
        parseLiveData(pendingCmd, data);
        pendingCmd = null;
      }
    };

    window.onBleError = function(error){
      log('ERROR: '+error, 'err');
      setStatus('❌ ERROR', 'off');
    };

    // ========================================
    // COMANDOS BLE
    // ========================================
    function doScan(){
      log('Iniciando escaneo BLE...', 'info');
      document.getElementById('devList').innerHTML = '';

      if(typeof Android !== 'undefined' && Android.bleScan){
        Android.bleScan();
      } else {
        log('Android.bleScan no disponible', 'err');
        alert('Esta app necesita correr dentro del WebView de Android');
      }
    }

    function doConnect(address){
      log('Conectando a '+address+'...', 'info');
      if(typeof Android !== 'undefined' && Android.bleConnect){
        Android.bleConnect(address);
      }
    }

    function doDisconnect(){
      log('Desconectando...', 'info');
      if(typeof Android !== 'undefined' && Android.bleDisconnect){
        Android.bleDisconnect();
      }
      if(liveInterval){clearInterval(liveInterval);liveInterval=null;}
    }

    function sendCmd(cmd){
      if(!connected){alert('No conectado');return;}
      log('TX: '+cmd, 'tx');
      if(typeof Android !== 'undefined' && Android.bleSend){
        Android.bleSend(cmd);
      }
    }

    // Promesa para esperar respuesta
    function sendCmdAsync(cmd, timeout=2000){
      return new Promise((resolve) => {
        log('TX: '+cmd, 'tx');
        pendingCmd = cmd;
        pendingResolver = resolve;

        if(typeof Android !== 'undefined' && Android.bleSend){
          Android.bleSend(cmd);
        }

        // Timeout
        setTimeout(() => {
          if(pendingResolver){
            pendingResolver = null;
            resolve(null);
          }
        }, timeout);
      });
    }

    // ========================================
    // PARSEO OBD2
    // ========================================
    function parseLiveData(cmd, response){
      // Limpiar respuesta
      const clean = response.replace(/[\s\r\n>]/g,'').toUpperCase();

      // Si dice "NODATA" o "ERROR"
      if(clean.includes('NODATA') || clean.includes('ERROR') || clean.includes('UNABLE')){
        return;
      }

      // RPM (010C → 41 0C XX YY)
      if(cmd === '010C' && clean.includes('410C')){
        const idx = clean.indexOf('410C');
        if(clean.length >= idx+8){
          const a = parseInt(clean.substr(idx+4,2), 16);
          const b = parseInt(clean.substr(idx+6,2), 16);
          const rpm = ((a*256)+b)/4;
          document.getElementById('vRPM').textContent = Math.round(rpm);
        }
      }
      // Velocidad (010D → 41 0D XX)
      else if(cmd === '010D' && clean.includes('410D')){
        const idx = clean.indexOf('410D');
        if(clean.length >= idx+6){
          const a = parseInt(clean.substr(idx+4,2), 16);
          document.getElementById('vSpeed').textContent = a;
        }
      }
      // Temperatura motor (0105 → 41 05 XX)
      else if(cmd === '0105' && clean.includes('4105')){
        const idx = clean.indexOf('4105');
        if(clean.length >= idx+6){
          const a = parseInt(clean.substr(idx+4,2), 16);
          const ect = a - 40;
          document.getElementById('vECT').textContent = ect;
        }
      }
      // TPS (0111 → 41 11 XX)
      else if(cmd === '0111' && clean.includes('4111')){
        const idx = clean.indexOf('4111');
        if(clean.length >= idx+6){
          const a = parseInt(clean.substr(idx+4,2), 16);
          const tps = (a*100)/255;
          document.getElementById('vTPS').textContent = tps.toFixed(0);
        }
      }
      // Carga motor (0104 → 41 04 XX)
      else if(cmd === '0104' && clean.includes('4104')){
        const idx = clean.indexOf('4104');
        if(clean.length >= idx+6){
          const a = parseInt(clean.substr(idx+4,2), 16);
          const load = (a*100)/255;
          document.getElementById('vLoad').textContent = load.toFixed(0);
        }
      }
      // Voltaje (ATRV → "12.5V")
      else if(cmd === 'ATRV'){
        const m = response.match(/(\d+\.\d+)/);
        if(m){
          document.getElementById('vVolt').textContent = m[1];
        }
      }
    }

    // ========================================
    // LECTURA EN VIVO
    // ========================================
    function startLive(){
      if(!connected){alert('No conectado');return;}
      if(liveInterval){return;}

      log('Iniciando lectura en vivo...', 'info');
      let cycle = 0;
      const cmds = ['010C','010D','0105','0111','0104','ATRV'];

      liveInterval = setInterval(() => {
        if(!connected){clearInterval(liveInterval);liveInterval=null;return;}
        const cmd = cmds[cycle % cmds.length];
        pendingCmd = cmd;
        if(typeof Android !== 'undefined' && Android.bleSend){
          Android.bleSend(cmd);
        }
        cycle++;
      }, 400);
    }

    function stopLive(){
      if(liveInterval){
        clearInterval(liveInterval);
        liveInterval = null;
        log('Lectura en vivo detenida', 'info');
      }
    }

    // ========================================
    // DTCs
    // ========================================
    async function readDTCs(){
      if(!connected){alert('No conectado');return;}
      log('Leyendo DTCs...', 'info');
      document.getElementById('dtcList').innerHTML = '<div class="empty">Leyendo...</div>';

      const response = await sendCmdAsync('03', 3000);
      if(!response){
        document.getElementById('dtcList').innerHTML = '<div class="empty">Sin respuesta</div>';
        return;
      }

      const clean = response.replace(/[\s\r\n>]/g,'').toUpperCase();

      if(clean.includes('NODATA') || clean.includes('43000000')){
        document.getElementById('dtcList').innerHTML = '<div class="empty">✅ Sin códigos de falla</div>';
        log('Sin DTCs activos', 'rx');
        return;
      }

      // Parsear DTCs
      const list = document.getElementById('dtcList');
      list.innerHTML = '';
      const idx = clean.indexOf('43');
      if(idx >= 0){
        const data = clean.substring(idx+2);
        const dtcs = [];
        for(let i=0; i<data.length-3; i+=4){
          const dtc = parseDTC(data.substr(i,4));
          if(dtc && dtc !== 'P0000') dtcs.push(dtc);
        }

        if(dtcs.length === 0){
          list.innerHTML = '<div class="empty">✅ Sin códigos de falla</div>';
        } else {
          dtcs.forEach(code => {
            const div = document.createElement('div');
            div.className = 'dtc-item';
            div.innerHTML = '<div class="dtc-code">'+code+'</div><div class="dtc-desc">Código DTC detectado</div>';
            list.appendChild(div);
          });
          log('Encontrados '+dtcs.length+' DTCs', 'rx');
        }
      }
    }

    function parseDTC(hex){
      if(!hex || hex.length !== 4) return null;
      const a = parseInt(hex.substr(0,2), 16);
      const b = parseInt(hex.substr(2,2), 16);
      if(a === 0 && b === 0) return null;

      const types = ['P','C','B','U'];
      const type = types[(a >> 6) & 0x03];
      const d1 = (a >> 4) & 0x03;
      const d2 = a & 0x0F;
      const d3 = (b >> 4) & 0x0F;
      const d4 = b & 0x0F;
      return type + d1.toString() + d2.toString(16).toUpperCase() + d3.toString(16).toUpperCase() + d4.toString(16).toUpperCase();
    }

    async function clearDTCs(){
      if(!connected){alert('No conectado');return;}
      if(!confirm('¿Borrar TODOS los DTCs?')) return;

      log('Borrando DTCs...', 'info');
      await sendCmdAsync('04', 3000);
      log('DTCs borrados', 'rx');
      document.getElementById('dtcList').innerHTML = '<div class="empty">DTCs borrados</div>';
    }

    // ========================================
    // INICIO
    // ========================================
    window.addEventListener('load', () => {
      log('App de prueba cargada', 'info');
      log('Vehículo: Nissan Tsuru / Chevy Aveo (genérico OBD2)', 'info');
      if(typeof Android === 'undefined'){
        log('⚠️ Android bridge no disponible', 'err');
        log('Esta app debe correr dentro del WebView de PROPART', 'err');
      } else {
        log('✅ Android bridge OK', 'rx');
      }
    });
</script>

</body>
</html>
